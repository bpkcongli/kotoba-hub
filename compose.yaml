name: kotoba-hub

services:
  app:
    build: .
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_MOCKING: 'false'
      DATABASE_URL: 'mysql://${MYSQL_USER:-kotoba}:${MYSQL_PASSWORD:-kotoba_local}@mysql:3306/${MYSQL_DATABASE:-kotoba_hub}'
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-OPENAI}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_GENERATION_MODEL: ${OPENAI_GENERATION_MODEL:-gpt-5.6-terra}
      OPENAI_NORMALIZATION_MODEL: ${OPENAI_NORMALIZATION_MODEL:-gpt-5.6-luna}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-1}
      AI_RETRY_DELAY_MS: ${AI_RETRY_DELAY_MS:-250}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-8192}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-40000}
    depends_on:
      mysql:
        condition: service_healthy
    init: true

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kotoba_hub}
      MYSQL_USER: ${MYSQL_USER:-kotoba}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kotoba_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kotoba_root_local}
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' > /dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
