          type: string
        recommendedDifficultyBand:
          type: string
    QuizPracticeUserAnswerShortFreeResponse:
      type: object
      additionalProperties: false
      required:
        - rawInputRomaji
        - normalizedKana
      properties:
        rawInputRomaji:
          type: string
          description: Jawaban mentah yang diketik user dalam romaji.
        normalizedKana:
          type: string
          description: Hasil transform input method ke kana sebelum submit final.
        normalizedKanji:
          type: string
          nullable: true
          description: Bentuk kanji final bila user atau IME memilih kandidat kanji.
    QuizShortFreeResponsePromptPayload:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - promptLanguage
        - answerLanguage
        - slotCount
        - sentenceTemplate
        - sentenceTemplateHtml
        - blankInputMode
        - inputMethod
        - placeholder
        - hintTexts
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
        promptLanguage:
          type: string
          enum:
            - JA
        answerLanguage:
          type: string
          enum:
            - JA
        slotCount:
          type: integer
          enum:
            - 1
        sentenceTemplate:
          type: string
        sentenceTemplateHtml:
          type: string
          description: HTML render string for the same prompt as sentenceTemplate.
        blankInputMode:
          type: string
          enum:
            - ROMAJI_TO_KANA
        placeholder:
          type: string
          nullable: true
        inputMethod:
          $ref: '#/components/schemas/QuizKanaInputMethod'
        hintTexts:
          type: array
          items:
            type: string
            minLength: 1
          description: HTML hints in the same resolved language as placeholder and explanation.
    QuizStatus:
      type: object
      additionalProperties: false
      required:
        - traceId
        - code
        - message
        - errorDetails
      properties:
        traceId:
          type: string
          format: uuid
        code:
          type: integer
          default: 120006000
        message:
          type: string
          default: Success!
        errorDetails:
          type: array
          items:
            $ref: '#/components/schemas/QuizErrorDetail'
          default: []
    UserPreferences:
