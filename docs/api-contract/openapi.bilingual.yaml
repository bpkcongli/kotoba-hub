                    id: 6e73b222-74ae-5fe0-9a36-5e49803089ac
                    skillCode: n5_copula_affirmative
                    questionType: SHORT_FREE_RESPONSE
                    difficultyLevel: 1
                    gradingStrategy: DETERMINISTIC
                    promptPayload:
                      schemaVersion: 1
                      sentenceTemplate: わたしは学生___。
                      sentenceTemplateHtml: <p>わたしは学生<span class="question-blank">___</span>。</p>
