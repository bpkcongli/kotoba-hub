                        translationRevision: 1
                      content:
                        skillCode: n5_copula_affirmative
                        ALL: null
                        STANDARD: null
                        POLITE: <p>[Topic] + は + Noun + <span class="text-emphasis">です</span><br>Name + <span class="text-emphasis">です</span></p>
