          default: []
    Pagination:
      type: object
      additionalProperties: false
      required:
        - pageNumber
        - pageSize
        - totalRecords
      properties:
        pageNumber:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalRecords:
          type: integer
          minimum: 0
    Metadata:
      type: object
      additionalProperties: false
