        contentLocale:
          $ref: '#/components/schemas/Locale'
        uiLocale:
          $ref: '#/components/schemas/Locale'
    UserPreferencesPatch:
      type: object
      additionalProperties: false
      properties:
        contentLocale:
          $ref: '#/components/schemas/Locale'
        uiLocale:
          $ref: '#/components/schemas/Locale'
      minProperties: 1
    UserPreferencesResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - data
      properties:
        status:
          $ref: '#/components/schemas/Status'
        data:
          $ref: '#/components/schemas/UserPreferences'
